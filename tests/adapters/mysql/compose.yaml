name: dbridge-mysql-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbridge_root
    ports:
      - "127.0.0.1:${DBRIDGE_TEST_MYSQL_PORT:-33084}:3306"
    command:
      - --performance-schema=ON
      - --performance-schema-consumer-events-statements-history-long=ON
      - --performance-schema-events-statements-history-long-size=10000
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -Nse 'SELECT COUNT(*) = 1000000 FROM dbridge_test.million_rows' | grep -qx 1"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
