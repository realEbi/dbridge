[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbridge"
version = "0.2.10"
description = ''
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [{ name = "realEbi", email = "ebrahim.soroush@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "duckdb==1.1.3",
  "sqlglot>=25.0.0",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "tomli-w>=1.0.0",
]

[project.scripts]
dbridge = "dbridge.server:main"

[project.optional-dependencies]
mysql = ["pymysql"]
postgres = ["psycopg2"]
snowflake = ["snowflake-connector-python"]

[project.urls]
Documentation = "https://github.com/realebi/dbridge#readme"
Issues = "https://github.com/realebi/dbridge/issues"
Source = "https://github.com/realebi/dbridge"

[dependency-groups]
dev = ["ruff", "black", "isort", "pyright", "pytest", "ipython"]
test = ["coverage[toml]", "pytest", "pytest-cov"]
types = ["mypy>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is deliberately not in addopts: a focused single-test run would then
# always fail the fail_under gate. Use `pytest --cov` for the gated run.
addopts = "-ra"

[tool.coverage.run]
# Measure the shipped server only. Test modules are excluded deliberately: a
# test file scores near 100% by construction and tells you nothing about
# dbridge. Parked adapters are excluded while they remain unregistered and
# their drivers optional; porting one out of _parked/ re-includes it.
source = ["src/dbridge"]
branch = true
omit = ["src/dbridge/__about__.py", "src/dbridge/adapters/_parked/*"]

[tool.coverage.paths]
dbridge = ["src/dbridge", "*/dbridge/src/dbridge"]

[tool.coverage.report]
# The floor, not the target. The suite runs well above this; the gap is
# deliberate so an ordinary change does not trip the gate.
fail_under = 85
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  # An `@abstractmethod` with a bare `...` body holds no behavior. Covering one
  # requires instantiating an ABC, which asserts nothing about dbridge.
  "^\\s*\\.\\.\\.$",
  "@(abc\\.)?abstractmethod",
]
