schema: spec-driven

context: |
  dbridge is a Python stdio JSON-RPC server using a src layout and uv.
  Read AGENTS.md for workflow and document ownership, CONTEXT.md for vocabulary,
  docs/architecture.md for implemented behavior, and relevant docs/adr/ decisions.
  Read docs/roadmap.md and the relevant docs/backlog/ item for future work.
  The server uses asyncio orchestration with Adapter-owned SQLite/DuckDB Lanes and
  optional MySQL native async Channels, cancellation, and bounded shutdown.
  ADR-0003 supersedes ADR-0001; ADR-0004 records MySQL interruption and limits.
  Future architecture requires an explicit change; distinguish plans from implementation.
  The server owns the DSP contract. Client repositories own editor/UI behavior.
  Plan in the original checkout; finalized plans are delivered to the PR target.
  Apply in separate topic worktrees; preserve the original checkout and transfer
  a local plan only as a fallback when it is absent from the fetched PR target.
  Follow AGENTS.md and docs/development.md for PR delivery and post-merge refresh.

rules:
  proposal:
    - Identify related backlog items and roadmap outcomes, or state that none apply.
    - Name affected repositories, scope limits, and protocol compatibility impact.
  specs:
    - Use the vocabulary in CONTEXT.md and distinguish guarantees from known gaps.
    - Ground existing behavior in source/tests; preserve UTF-8 offset and framing semantics when affected.
  design:
    - Reference relevant ADRs and identify decisions that would supersede them.
    - Resolve server/client ownership and migration compatibility for cross-repository changes.
  tasks:
    - Include the affected documentation updates from the AGENTS.md ownership table.
    - Organize work into verifiable slices; name the owning repo and integration check for cross-repository tasks.

operations:
  apply:
    guidance:
      - Before editing, record the original checkout and use a topic worktree from the fetched PR target (origin/dbridge-2.0 by default), which normally already contains the finalized plan; only when the selected plan is absent there, transfer its local directory and required related edits as a fallback.
      - Keep one implementation checklist in the change; record unrelated findings in docs/backlog/.
      - Match verification to risk and isolate test databases, Profile files, and subprocesses.
      - Complete verification, documentation, spec synchronization, and archive in the worktree; applying a plan authorizes scoped commits, topic push, and a GitHub PR unless the user restricts delivery.
      - Merge implementation PRs only on a separate user instruction; after confirmed merge, refresh the recorded original checkout only under the clean, unchanged, zero-ahead fast-forward conditions in AGENTS.md.
  archive:
    guidance:
      - Check affected current architecture, roadmap, glossary, ADR, usage, and example updates before completion.
      - Synchronize verified requirement deltas and update linked backlog items to the archive location.
